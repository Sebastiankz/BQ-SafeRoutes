# Opcional: Postgres + Redis locales. El backend FastAPI va con venv (backend/README.md);
# el dashboard web suele ir con `npm run dev` en web-dashboard/.
services:

  # ── BASE DE DATOS ────────────────────────────────────────────────────────────
  db:
    # Imagen oficial de PostgreSQL 16 con la extensión PostGIS ya incluida.
    # PostGIS permite guardar y consultar coordenadas GPS directamente en SQL.
    image: postgis/postgis:16-3.4

    # Nombre visible en Docker Desktop y en los logs.
    container_name: saferoutes-db

    # Si el contenedor se cae solo (error), Docker lo reinicia automáticamente.
    # "unless-stopped" significa: reinicia siempre, excepto si lo detuviste tú a propósito.
    restart: unless-stopped

    # Variables de entorno: configuran el usuario, contraseña y nombre de la BD.
    # Sintaxis ${VAR:-default}: lee la variable del archivo .env;
    # si no existe el .env o la variable está vacía, usa el valor tras ":-".
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saferoutes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saferoutes_dev}
      POSTGRES_DB: ${POSTGRES_DB:-saferoutes}

    # Expone el puerto de PostgreSQL hacia tu Mac.
    # Formato: "puerto_en_tu_mac:puerto_dentro_del_contenedor"
    # Así puedes conectarte con DBeaver, TablePlus, etc. desde fuera de Docker.
    ports:
      - "${DB_PORT:-5432}:5432"

    volumes:
      # Volumen nombrado: los datos de la BD se guardan aquí.
      # Si eliminas el contenedor pero NO el volumen, los datos sobreviven.
      # Si haces "docker compose down -v", pierdes todo.
      - pgdata:/var/lib/postgresql/data

      # Monta el archivo SQL local dentro del contenedor en una carpeta especial.
      # PostgreSQL ejecuta automáticamente todo lo que encuentre ahí la primera vez
      # que arranca con una BD vacía: crea tablas, índices, datos de ejemplo.
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql

    # Comprobación de salud: Docker pregunta cada 5 segundos si la BD está lista.
    # "pg_isready" devuelve OK cuando PostgreSQL acepta conexiones.
    # Otros servicios usan este estado para saber cuándo pueden arrancar.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saferoutes}"]
      interval: 5s   # cada cuánto comprueba
      timeout: 5s    # cuánto espera la respuesta antes de contar como fallo
      retries: 5     # cuántos fallos consecutivos antes de marcar el servicio como "unhealthy"

  # ── CACHÉ ────────────────────────────────────────────────────────────────────
  redis:
    # Redis es una base de datos en memoria (ultra rápida).
    # Se usa para guardar sesiones de usuario, resultados temporales,
    # o como cola de tareas, sin tener que ir a PostgreSQL cada vez.
    # "alpine" = imagen mínima de Linux (~30 MB vs ~300 MB de la normal).
    image: redis:7-alpine

    container_name: saferoutes-redis
    restart: unless-stopped

    ports:
      - "${REDIS_PORT:-6379}:6379"

    volumes:
      # Persiste los datos de Redis en un volumen (opcional para caché,
      # pero útil si se usa como cola de tareas).
      - redisdata:/data

    healthcheck:
      # "redis-cli ping" devuelve "PONG" si Redis está vivo.
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

# ── VOLÚMENES NOMBRADOS ───────────────────────────────────────────────────────
# Docker gestiona estos volúmenes fuera de tu sistema de archivos normal.
# Sobreviven a "docker compose down" pero se eliminan con "docker compose down -v".
volumes:
  pgdata:     # datos de PostgreSQL
  redisdata:  # datos de Redis
