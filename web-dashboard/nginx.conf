server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip para reducir el peso de JS/CSS.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1024;

    # Caché agresivo para assets con hash en el nombre (Vite los versiona).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy hacia el backend FastAPI.
    # El navegador llama a /api/... y nginx lo reenvía al servicio "backend"
    # dentro de la red de docker-compose (puerto 8000).
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: si la ruta no existe como archivo, devuelve index.html
    # para que el router del frontend (JS) la maneje.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
